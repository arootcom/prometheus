global:
  scrape_interval: 30s # Центральный сервер может опрашивать чуть реже

scrape_configs:
  - job_name: 'federate-worker-east'
    honor_labels: true # Сохраняет оригинальные лейблы (job, instance), созданные воркером
    metrics_path: '/federate'
    params:
      # Регулярные выражения для фильтрации метрик, которые мы забираем
      match[]:
        - '{job="local-apps"}' # Забрать все метрики из этой джобы
        - '{__name__=~"node_.*"}' # Или забрать все системные метрики node_exporter
        - '{__name__=~"myapp_.*"}' # Или метрики Go-приложения
        - '{job="my-local-go-app"}'
        - '{job="my-app"}'
    static_configs:
      - targets: ['host.docker.internal:9090']

